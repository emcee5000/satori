name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test the Mac app
        run: swift test

      - name: Test the web app
        run: |
          # Repeating to-dos count in local days, so check a few time zones.
          for tz in UTC America/New_York Pacific/Auckland; do
            TZ=$tz node --test Tests/web/*.test.js
          done

      - name: Package Satori.app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/Satori.app build/Satori.zip

      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: Satori
          path: build/Satori.zip
