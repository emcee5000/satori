name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Package Satori.app
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/Satori.app build/Satori.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Satori
          path: build/Satori.zip
